# QuickDrop coturn TURN / STUN server configuration
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech
realm=quickdrop.local

# Default credentials (replace in production with dynamic auth or environment)
user=quickdropuser:quickdroppass

# Stun/Turn logging
verbose
no-cli
no-tls
no-dtls
